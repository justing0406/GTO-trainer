name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Check deploy from repository root
        run: npm run check:deploy
      - name: Check deploy from worker root
        run: npx wrangler deploy --dry-run --config worker/wrangler.jsonc
      - name: Check deploy from web root
        run: npx wrangler deploy --dry-run --config web/wrangler.jsonc
      - name: Check browser JavaScript syntax
        run: node --check web/config.js && node --check web/app.js
